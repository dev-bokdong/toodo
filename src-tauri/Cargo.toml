[package]
name = "toodo"
version = "0.12.0"
description = "Turn a task plan into implemented, reviewed code with herdr"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "toodo"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "toodo-server"
path = "src/bin/toodo-server.rs"
required-features = ["server"]

[features]
default = ["desktop"]
# The Windows desktop app: the Tauri shell around the commands.
desktop = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-specta",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-opener",
  # Links into the Android app (`toodo://`); started on mobile only.
  "dep:tauri-plugin-deep-link",
  # Requests to a `toodo-server` the app connects to (see `src/remote/`).
  "tokio/sync",
  "tokio/time",
  "dep:reqwest",
  "dep:rustls",
  "dep:futures-util",
  "futures-util?/sink",
  "futures-util?/alloc",
  "dep:tokio-tungstenite",
  "dep:base64",
  "dep:webpki-roots",
  # Checks the wake word model the macOS app downloads (see `src/dictation/wake/`).
  "dep:sha2",
]
# The headless server (`toodo-server`): the same commands over HTTP for the web build of
# the frontend. Build it without the default features.
server = [
  "tokio/rt-multi-thread",
  "tokio/signal",
  "tokio/sync",
  "tokio/fs",
  "tokio/time",
  "axum/ws",
  "axum/query",
  "dep:tower-http",
  "dep:futures-util",
  "dep:sha2",
  "dep:ring",
  "dep:rustls",
  "dep:reqwest",
  "dep:base64",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"], optional = true }
specta-typescript = "0.0.12"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
# Web Push: message encryption and VAPID signing, and posting to push services.
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
base64 = { version = "0.22", optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, optional = true }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
tokio = { version = "1.53.3", features = ["net", "rt", "macros"] }
getrandom = { version = "0.3", features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
schemars = "1"


# Desktop only: the Android app is installed and updated as an APK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

# The Android app checks servers' certificates against these roots (see `src/remote/`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Native dictation in the macOS app (src/dictation/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSLocale", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSound"] }
# The wake word's recognizer (src/dictation/wake/), linked statically from its prebuilt
# release libraries.
sherpa-onnx = "2.0.0"
objc2-speech = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-avf-audio",
  "SFSpeechRecognizer",
  "SFSpeechRecognitionRequest",
  "SFSpeechRecognitionResult",
  "SFSpeechRecognitionTask",
  "SFTranscription",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "AVAudioEngine",
  "AVAudioNode",
  "AVAudioIONode",
  "AVAudioFormat",
  "AVAudioBuffer",
  "AVAudioTime",
  "AVAudioTypes",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
