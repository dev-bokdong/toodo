[package]
name = "toodo"
version = "0.10.1"
description = "Turn a task plan into implemented, reviewed code with herdr"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "toodo"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "toodo-server"
path = "src/bin/toodo-server.rs"
required-features = ["server"]

[features]
default = ["desktop"]
# The Windows desktop app: the Tauri shell around the commands.
desktop = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-specta",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-opener",
]
# The headless server (`toodo-server`): the same commands over HTTP for the web build of
# the frontend. Build it without the default features.
server = [
  "tokio/rt-multi-thread",
  "tokio/signal",
  "tokio/sync",
  "dep:tower-http",
  "dep:futures-util",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"], optional = true }
specta-typescript = "0.0.12"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
tokio = { version = "1.53.3", features = ["net", "rt", "macros"] }
getrandom = { version = "0.3", features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
schemars = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
