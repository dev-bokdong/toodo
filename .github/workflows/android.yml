name: Android

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Install dependencies
        run: npm ci

      # Every APK is signed with the same key, so a newer one installs over the one on the
      # phone. Without the key (pull requests from forks) the APK is a debug build, signed
      # with the runner's throwaway debug key.
      - name: Set up the signing key
        id: signing
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 -d <<< "$KEY_BASE64" > "$RUNNER_TEMP/toodo-release.jks"
          {
            echo "keyAlias=toodo"
            echo "password=$KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/toodo-release.jks"
          } > src-tauri/gen/android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ "$SIGNED" = true ]; then
            npx tauri android build --apk --target aarch64
          else
            npx tauri android build --apk --target aarch64 --debug
          fi
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          version=$(node -p 'require("./package.json").version')
          mkdir -p dist-android
          cp "$apk" "dist-android/toodo-$version-android-arm64.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner" verify --print-certs dist-android/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: toodo-android
          path: dist-android/*.apk
          if-no-files-found: error
