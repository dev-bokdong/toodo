name: Rust

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "src-tauri/**"
      - "src/lib/bindings.ts"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/lib/bindings.ts"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust
    # toodo-server runs on Linux, so it is checked there.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # CI only typechecks; tests run locally (see AGENTS.md). --all-targets keeps the
      # test code compiling too.
      - name: Typecheck
        run: cargo check --all-targets --locked
