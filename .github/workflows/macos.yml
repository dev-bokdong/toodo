name: macOS

# Builds the macOS app (Apple Silicon) as a client of a toodo-server: an ad-hoc signed
# .app and .dmg, kept as a workflow artifact. There is no Developer ID or notarization, and
# releases and the updater stay Windows-only (see docs/macos.md).
on:
  push:
    branches:
      - dev
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  app:
    name: macOS app
    # An Apple Silicon runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The macOS-only code (the menu bar icon) is checked here.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target aarch64-apple-darwin --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --target aarch64-apple-darwin --lib

      # Picks up src-tauri/tauri.macos.conf.json: .app and .dmg, ad-hoc signed.
      - name: Build
        run: npx tauri build --target aarch64-apple-darwin

      - name: Check the signature and the bundle
        run: |
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Toodo.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          lipo -archs "$app/Contents/MacOS/toodo"

      # Zipped with ditto, which keeps the bundle's permissions and links.
      - name: Package
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Toodo.app artifacts/Toodo-macos-arm64.app.zip
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: toodo-macos-arm64
          path: artifacts/
          if-no-files-found: error
