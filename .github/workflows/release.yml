name: Release

# Releases run from main so the Rust build cache saved by one release is visible to the
# next one (caches saved under a tag ref are invisible to every other tag). A push to main
# releases the version in src-tauri/tauri.conf.json unless that version is already
# published; run the workflow by hand on main to retry a failed release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app version is already released
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # A release counts as published once latest.json is uploaded, which tauri-action
          # does last; a release left half-uploaded by a failed run is completed instead.
          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and ($assets -split "`n") -contains 'latest.json') {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Output "$tag is already released; nothing to do."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
            Write-Output "Releasing $tag."
          }
          exit 0

      - if: steps.version.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - if: steps.version.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.version.outputs.skip == 'false'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - if: steps.version.outputs.skip == 'false'
        run: npm ci

      - if: steps.version.outputs.skip == 'false'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Toodo ${{ steps.version.outputs.tag }}
          releaseDraft: false
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --config src-tauri/tauri.release.conf.json
