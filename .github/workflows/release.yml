name: Release

# Releases run from main so the Rust build cache saved by one release is visible to the
# next one (caches saved under a tag ref are invisible to every other tag). A push to main
# releases the version in package.json unless that version is already published; run the
# workflow by hand on main to retry a failed release.
#
# A release vX.Y.Z carries the Linux toodo-server with the web app (a tarball + its
# sha256). It is skipped when both assets are already there, so a re-run completes a
# half-done release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      server-done: ${{ steps.check.outputs.server-done }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that every version file has the same version
        run: node scripts/bump-version.mjs --check

      - name: Check whether the release is already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
          has() { grep -qxF "$1" <<<"$assets"; }
          server="toodo-server-$tag-linux-x86_64.tar.gz"
          if has "$server" && has "$server.sha256"; then
            echo "server-done=true" >>"$GITHUB_OUTPUT"
          else
            echo "server-done=false" >>"$GITHUB_OUTPUT"
          fi
          echo "$tag assets: ${assets:-none}"

  server:
    needs: version
    if: needs.version.outputs.server-done == 'false'
    # The oldest supported runner, so the binary links against an old glibc and runs on
    # current Debian and Ubuntu LTS releases too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Build toodo-server
        working-directory: src-tauri
        run: >-
          cargo build --release --locked --bin toodo-server --target x86_64-unknown-linux-gnu

      - name: Package toodo-server
        id: package
        run: |
          tarball=$(scripts/package-server.sh \
            src-tauri/target/x86_64-unknown-linux-gnu/release/toodo-server dist-web dist-server)
          expected="dist-server/toodo-server-${{ needs.version.outputs.tag }}-linux-x86_64.tar.gz"
          [ "$tarball" = "$expected" ] || { echo "::error::built $tarball, expected $expected"; exit 1; }
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"

      - name: Upload toodo-server to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Toodo $TAG" --target "$GITHUB_SHA" --notes ""
          fi
          # The checksum goes last: a release with both assets is complete.
          gh release upload "$TAG" "$TARBALL" --clobber
          gh release upload "$TAG" "$TARBALL.sha256" --clobber
